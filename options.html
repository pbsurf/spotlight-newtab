<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; padding: 8px 4px; }
    label { display: block; margin: 6px 0; }
    .hint { color: #777; font-size: 12px; margin-left: 24px; }
  </style>
</head>
<body>
  <p><strong>Image source</strong></p>
  <label><input type="radio" name="source" value="spotlight"> Windows Spotlight</label>

  <label><input type="radio" name="source" value="bing"> Bing image of the day</label>
  <div class="hint">One image per day; ↻ picks one from the past week.</div>
  <script src="options.js"></script>
</body>
</html>
